version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rec-postgres
    environment:
      POSTGRES_DB: recommendations
      POSTGRES_USER: recuser
      POSTGRES_PASSWORD: recpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recuser -d recommendations"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rec-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: rec-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
      - ./mlruns:/mlruns
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlruns --host 0.0.0.0 --port 5000

  django-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rec-django-app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=recommendations
      - POSTGRES_USER=recuser
      - POSTGRES_PASSWORD=recpass
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - .:/app

volumes:
  postgres_data:
  qdrant_storage:
  mlflow_data:
